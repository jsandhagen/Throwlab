name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Use the keystore committed in the repo so every build has the same
      # signature — otherwise Android refuses to update over a previous install.
      - name: Install signing key
        run: mkdir -p ~/.android && cp .github/android-debug.keystore ~/.android/debug.keystore
      - name: Generate Android platform folder
        run: flutter create . --platforms=android --project-name throwlab
      # The in-app updater downloads the new APK (INTERNET) and hands it to
      # the system installer (REQUEST_INSTALL_PACKAGES).
      - name: Add updater permissions to manifest
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      # The run number becomes the APK's build number; the same number is
      # published as version.txt so installed apps can detect newer builds.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk ThrowLab.apk
      - run: echo "${{ github.run_number }}" > version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ThrowLab-apk
          path: ThrowLab.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ThrowLab.apk version.txt \
            --title "ThrowLab — build ${{ github.run_number }}" \
            --notes "APK built from main at ${GITHUB_SHA::7}. On your phone, download **ThrowLab.apk** below, open it, and allow the install. Installed apps offer this update automatically on launch."
