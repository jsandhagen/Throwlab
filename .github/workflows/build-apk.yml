name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Use the keystore committed in the repo so every build has the same
      # signature — otherwise Android refuses to update over a previous install.
      - name: Install signing key
        run: mkdir -p ~/.android && cp .github/android-debug.keystore ~/.android/debug.keystore
      - name: Generate Android platform folder
        run: flutter create . --platforms=android --project-name throwlab
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ThrowLab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThrowLab-apk
          path: ThrowLab.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ThrowLab.apk \
            --title "ThrowLab — latest build" \
            --notes "APK built from main at ${GITHUB_SHA::7}. On your phone, download **ThrowLab.apk** below, open it, and allow the install."
