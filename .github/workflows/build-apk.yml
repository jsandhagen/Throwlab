name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Builds of older commits racing past newer ones can publish stale APKs to
# the rolling release; cancel the in-flight build when a new push lands.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform folder
        run: flutter create . --platforms=android --project-name throwlab
      # The in-app updater downloads the new APK (INTERNET) and hands it to
      # the system installer (REQUEST_INSTALL_PACKAGES). It downloads under a
      # foreground service so leaving the app doesn't stop it: that needs the
      # Android 14+ type permission and a wifi lock, and the service itself
      # has to be declared here — flutter_foreground_task's own manifest
      # merges in FOREGROUND_SERVICE, WAKE_LOCK and POST_NOTIFICATIONS, but
      # not these and not the <service> element.
      - name: Add updater permissions to manifest
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|    <service\n            android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n            android:foregroundServiceType="dataSync"\n            android:exported="false" />\n    </application>|' android/app/src/main/AndroidManifest.xml
          # A silently failed sed here ships an app whose update stops the
          # moment the phone is locked, so prove both landed.
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' android/app/src/main/AndroidManifest.xml
          grep -q 'flutter_foreground_task.service.ForegroundService' android/app/src/main/AndroidManifest.xml
      # ffmpeg-kit requires Android 7+ (API 24).
      - name: Raise minSdk for ffmpeg-kit
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
      # ffmpeg_kit_flutter_new ships no consumer ProGuard rules, so R8 (on by
      # default in release builds) breaks plugin channel registration —
      # shared_preferences fails with "Unable to establish connection" and the
      # app hangs on the startup spinner (sk3llo/ffmpeg_kit_flutter#82). The
      # package's own example app also builds release with minification off.
      - name: Disable R8 minification (incompatible with ffmpeg-kit)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/^\([[:space:]]*\)release {/\1release {\n\1    isMinifyEnabled = false\n\1    isShrinkResources = false/' android/app/build.gradle.kts
            grep -q "isMinifyEnabled = false" android/app/build.gradle.kts
          else
            sed -i 's/^\([[:space:]]*\)release {/\1release {\n\1    minifyEnabled false\n\1    shrinkResources false/' android/app/build.gradle
            grep -q "minifyEnabled false" android/app/build.gradle
          fi
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      # The run number becomes the APK's build number; the same number is
      # published as version.txt so installed apps can detect newer builds.
      #
      # THROWLAB_RELAY is the hostname every share link is built on, baked
      # in here because it is a property of the build and not of a meet — a
      # coach must never be typing a URL, and a wrong one fails at a ring
      # with a stand watching. Not a secret: it is printed under every QR
      # code the app hands out. A build that names none says so on the share
      # sheet rather than guessing, which is what a local `flutter run` gets.
      - run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=THROWLAB_RELAY=https://throwlab.jakobscottsandhagen.workers.dev
      # If minification ever sneaks back in, plugin class names get obfuscated
      # and the startup hang returns; fail the build instead of shipping it.
      - name: Verify plugin classes survived unminified
        run: |
          unzip -p build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' \
            | grep -aq "io/flutter/plugins/sharedpreferences/SharedPreferencesPlugin"
          unzip -p build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' \
            | grep -aq "com/pravera/flutter_foreground_task/FlutterForegroundTaskPlugin"
      # The seds above edit the source manifest; what runs on the phone is the
      # *merged* one. A service missing from that throws at startService, the
      # updater quietly falls back to downloading only while the app is open,
      # and nobody finds out until a download dies at the lock screen — so
      # read it back off the built APK rather than trusting the merge.
      - name: Verify the foreground service survived the manifest merge
        run: |
          # AGP writes the merged manifest as plain XML on the way to the APK,
          # which is worth more than aapt2's dump of the binary one: it is
          # readable, so a failure here can say what it actually found.
          # build/app, not build/ and not android/app/build: Flutter points
          # Gradle's build directory at the project root (which is why the
          # APK above comes out of build/app/outputs) and every plugin gets
          # a sibling directory there — searching build/ finds ffmpeg-kit's
          # merged manifest, which was never going to declare our service.
          MERGED=$(find build/app -name AndroidManifest.xml -path '*merged*' \
            -path '*release*' 2>/dev/null | head -1)
          if [ -z "$MERGED" ]; then
            echo "no merged manifest for the app; every manifest under build/:"
            find build -name AndroidManifest.xml | head -30
            exit 1
          fi
          # Prove it is the app's before believing anything it does or does
          # not say: the last failure read a plugin's manifest and reported
          # four things missing from a file that never had them.
          if ! grep -q 'MainActivity' "$MERGED"; then
            echo "$MERGED is not the app's manifest (no MainActivity); candidates:"
            find build/app -name AndroidManifest.xml -path '*merged*' | head -20
            exit 1
          fi
          echo "reading $MERGED"
          echo "--- what it declares ---"
          grep -nE 'uses-permission|<service|foregroundServiceType' "$MERGED" || true
          echo "------------------------"
          fail=0
          for want in \
            'com.pravera.flutter_foreground_task.service.ForegroundService' \
            'android.permission.FOREGROUND_SERVICE_DATA_SYNC' \
            'android.permission.FOREGROUND_SERVICE"' \
            'foregroundServiceType="dataSync"'; do
            if grep -qF "$want" "$MERGED"; then
              echo "ok   $want"
            else
              echo "MISSING   $want"
              fail=1
            fi
          done
          # A service missing here throws at startService, the updater
          # swallows it, and downloading quietly goes back to working only
          # while the app is open — so this is worth failing the build for.
          [ "$fail" = 0 ]
      # Gradle signs with a debug keystore generated per-runner, which changes
      # the signature every build and makes Android reject updates over the
      # previous install. Re-sign deterministically with the repo keystore,
      # then fail the build if the certificate isn't the expected one.
      - name: Re-sign APK with repo keystore
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/apksigner" sign \
            --ks .github/android-debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out ThrowLab.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$TOOLS/apksigner" verify --print-certs ThrowLab.apk | tee certs.txt
          grep -qi "2f1b1bc1341cc66aa69cd85e4cf72019a1b534895729978fa7b9bf0c73db6bab" certs.txt
      - run: echo "${{ github.run_number }}" > version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ThrowLab-apk
          path: ThrowLab.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ThrowLab.apk version.txt \
            --title "ThrowLab — build ${{ github.run_number }}" \
            --notes "APK built from main at ${GITHUB_SHA::7}. On your phone, download **ThrowLab.apk** below, open it, and allow the install. Installed apps offer this update automatically on launch."
