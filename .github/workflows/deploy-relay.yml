name: Deploy relay

# The app and the relay are two halves of one feature and used to ship by
# two different routes: CI built the APK and somebody remembered to run
# `wrangler deploy` by hand. They drifted, and nothing anywhere said so —
# the phone asked spectators who they came to watch and the relay, still on
# older code, threw the question away before the Durable Object saw it. So
# the relay ships the way the APK does.
on:
  push:
    branches: [main]
    # Only what the relay is actually built out of: its own source and
    # config, and the typeface `stage-fonts.js` copies out of the app. A
    # deploy restarts the Durable Objects, and a competition being read by
    # a stand is not worth restarting for a change to a screen.
    paths:
      - 'worker/**'
      - 'assets/fonts/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check it, but do not touch the live relay'
        type: boolean
        default: false

permissions:
  contents: read

# Queued rather than cancelled: an APK build that loses a race publishes a
# stale file, which is worth cancelling for, but a deploy that loses one is
# half-way through uploading to the thing a stand is reading. GitHub keeps
# only the newest run waiting, so the last push still wins.
concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # Loudly, and before anything else. A deploy that quietly does
      # nothing is how the relay fell behind in the first place.
      - name: Check there is a key to deploy with
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No CLOUDFLARE_API_TOKEN secret on this repository." \
                 "Create a Cloudflare API token with permission to edit" \
                 "Workers, then add it under Settings -> Secrets and" \
                 "variables -> Actions as CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - run: npm ci

      # The relay's own tests, under miniflare. Nothing reaches the thing a
      # stand is reading without them passing first.
      - run: npm test

      # `npm run deploy` stages Barlow out of the app's `assets/fonts/` and
      # then deploys; `public/` is built here every time and never cached,
      # because it is served to the internet whole and a restored one can
      # carry a file nobody meant to publish.
      - name: Deploy
        if: ${{ !inputs.dry_run }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only needed when the token can reach more than one account.
          # Empty is the same as unset as far as wrangler is concerned.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check it without deploying
        if: ${{ inputs.dry_run }}
        run: npm run stage && npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
