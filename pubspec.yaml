name: throwlab
description: Track & field throwing analysis — video breakdowns, slow motion, drawing, and throw comparison.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  http: ^1.2.2
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  ffmpeg_kit_flutter_new: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Used by the widget tests to stand in for the real video platform.
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.3.0
  flutter_launcher_icons: ^0.14.1

# The APK build resolves dependencies fresh every time, so a bad release of
# any transitive package breaks it. path_provider_android 2.3.x pulls in jni,
# and jni 1.0.1 (2026-07-27) added a top-level `kotlin {}` block to its
# build.gradle while only applying the Kotlin plugin when AGP is older than 9
# — so evaluating :jni dies with "Could not find method kotlin()" and the
# release build fails. Nothing here needs 2.3; stay on the last line without
# that dependency until jni's Gradle is fixed.
dependency_overrides:
  path_provider_android: ">=2.2.23 <2.3.0"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
  # Bundled rather than fetched at runtime: the app is used at a track,
  # often with no signal. Barlow is OFL-licensed; see Barlow-OFL.txt.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
